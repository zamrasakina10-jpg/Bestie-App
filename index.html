<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Bestie! ✨</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 350px;
            transition: all 0.5s ease;
        }
        h2 { color: #ff477e; margin-bottom: 20px; }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            margin: 10px;
        }
        .btn-yes { background-color: #ff477e; color: white; }
        .btn-no { background-color: #6c757d; color: white; position: relative; }
        .hidden { display: none !important; }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ff758f;
            margin-bottom: 15px;
        }
        /* Candle Styling */
        .candle-container { cursor: pointer; margin: 20px auto; width: 60px; height: 120px; position: relative; }
        .candle { background: #ffb3c1; width: 30px; height: 80px; position: absolute; bottom: 0; left: 15px; border-radius: 5px; }
        .flame {
            background: #ffbc42;
            width: 16px;
            height: 26px;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: 10px;
            left: 22px;
            box-shadow: 0 0 10px #ffbc42;
            animation: flicker 0.1s infinite alternate;
        }
        @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    </style>
</head>
<body>

    <!-- SCREEN 1 -->
    <div id="screen1" class="card">
        <h2>Hey Bestie! I wanna show you something... Do you wanna see it? 😏</h2>
        <button class="btn-yes" onclick="nextScreen(2)">YES! 😍</button>
        <button class="btn-no" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No 🙄</button>
    </div>

    <!-- SCREEN 2 -->
    <div id="screen2" class="card hidden">
        <!-- REPLACE 'photo.jpg' WITH HER ACTUAL PHOTO NAME LATER -->
        <img src="photo.jpg" class="profile-pic" alt="Bestie">
        <h2>Make a wish and blow out the candle! 🎂</h2>
        <div class="candle-container" onclick="blowCandle()">
            <div class="flame" id="flame"></div>
            <div class="candle"></div>
        </div>
    </div>

    <!-- SCREEN 3 -->
    <div id="screen3" class="card hidden">
        <h2>✨ HAPPY BIRTHDAY BESTIE! ✨</h2>
        <p style="font-size: 18px; color: #555;">You are stuck with me forever! May your day be filled with endless laughter, cake, and annoying messages from me! 🎉❤️</p>
    </div>

    <script>
        function nextScreen(screenNum) {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('screen2').classList.remove('hidden');
        }

        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function blowCandle() {
            document.getElementById('flame').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('screen2').classList.add('hidden');
                document.getElementById('screen3').classList.remove('hidden');
            }, 800);
        }
    </script>
</body>
</html>
